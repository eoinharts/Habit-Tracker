# User Type
# Users Table
type User @table {
  id: String! @default(expr: "auth.uid")  # Firebase Auth UID as primary key
  name: String! @col(dataType: "varchar(100)")
  email: String! @col(dataType: "varchar(255)")
  imageUrl: String
  totalStreak: Int! @default(value: 0)

  # Relationships
#   friendships: [Friendship!]! @link
#   userHabits: [User_Habit!]! @link
#   userChallenges: [User_Challenge!]! @link
}

# Friendships Table (Many-to-Many Self-Join)
type Friendship @table(key: ["user1", "user2"]) {
  user1: User!
  user2: User!
  status: String!  # "pending", "accepted", "blocked"
}

# Habits Table
type Habit @table {
  id: UUID! @default(expr: "uuidV4()")  # Random UUID
  creator: User!
  title: String! @col(dataType: "varchar(100)")
  description: String
  category: String
  createdAt: Timestamp! @default(expr: "request.time")
  streakGoal: Int!

  # Relationships
#   userHabits: [User_Habit!]! @link
#   challenges: [Challenge!]! @link
}

# User_Habits Table (Tracking Streaks)
type UserHabit @table(key: ["habit", "user"]) {
  habit: Habit!
  user: User!
  currentStreak: Int! @default(value: 0)
  longestStreak: Int! @default(value: 0)
  lastTrackedDate: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

