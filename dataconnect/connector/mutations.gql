# Get user notifications
query ListUserNotifications($userId: String!) @auth(level: USER) {
  notifications(
    where: { user: { id: $userId } }
    orderBy: { createdAt: DESC }
  ) {
    id
    type
    message
    createdAt
    read
    fromUser {
      id
      name
    }
    habit {
      id
      title
    }
  }
}

# Export the query
export query ListUserNotifications($userId: String!) @auth(level: USER) {
  notifications(
    where: { user: { id: $userId } }
    orderBy: { createdAt: DESC }
  ) {
    id
    type
    message
    createdAt
    read
    fromUser {
      id
      name
    }
    habit {
      id
      title
    }
  }
}