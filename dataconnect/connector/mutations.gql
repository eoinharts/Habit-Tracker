# Firebase Data Connect GraphQL Mutations for Habit Tracker

# Create a user
mutation CreateUser($id: String! = "auth.uid", $name: String! = "Testing Name", $email: String! = "Testing Email") @auth(level: USER) {
  user_insert(data: { id: $id,name: $name, email: $email})
}

mutation AddFriend($friendId: String!) @auth(level: USER) {
  friendship_insert(data: {
    user1Id_expr: "auth.uid",
    user2Id: $friendId,
    status: "pending"
  })
}


# Remove a friend
mutation RemoveFriend($friendId: String!) @auth(level: USER) {
  friendship_delete(
    key: { user1Id: "auth.uid", user2Id: $friendId }
  )
}

# Create a habit
mutation CreateHabit($title: String!, $description: String!, $category: String!, $streakGoal: Int!) @auth(level: USER) {
  habit_insert(
    data: { creatorId: "auth.uid", title: $title, description: $description, category: $category, streakGoal: $streakGoal }
  )
}

# Update a habit
mutation UpdateHabit($habitId: UUID!, $title: String, $description: String, $category: String, $streakGoal: Int) @auth(level: USER) {
  habit_update(
    key: { id: $habitId }
    data: { title: $title, description: $description, category: $category, streakGoal: $streakGoal }
  )
}

# Delete a habit
mutation DeleteHabit($habitId: UUID!) @auth(level: USER) {
  habit_delete(
    key: { id: $habitId }
  )
}

# Update habit streak
mutation UpdateHabitStreak($habitId: UUID!, $currentStreak: Int!, $longestStreak: Int!, $lastTrackedDate: Timestamp!) @auth(level: USER) {
  userHabit_upsert(
    data: {
      habitId: $habitId,
      userId_expr: "auth.uid",
      currentStreak: $currentStreak,
      longestStreak: $longestStreak,
      lastTrackedDate: $lastTrackedDate
    }
  )
}

