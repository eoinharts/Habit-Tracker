# Firebase Data Connect GraphQL Mutations for Habit Tracker

# Create a user
mutation CreateUser($id: String! = "auth.uid", $name: String! = "Testing Name", $email: String! = "Testing Email") @auth(level: USER) {
  user_insert(data: { id: $id,name: $name, email: $email})
}

# ✅ Send a friend request
mutation AddFriend($friendId: String!, $currentUserId: String!) @auth(level: USER) {
  friendship_insert(
    data: {
      user1: { id: $currentUserId }
      user2: { id: $friendId }
      status: "pending"
    }
  )
}

#  Remove a friend or cancel a request
mutation DeleteFriend($currentUserId: String!, $friendId: String!) @auth(level: USER) {
  # Attempt #1 (user1Id = currentUserId, user2Id = friendId)
  first: friendship_delete(
    key: { user1Id: $currentUserId, user2Id: $friendId }
  )

  # Attempt #2 (user1Id = friendId, user2Id = currentUserId)
  second: friendship_delete(
    key: { user1Id: $friendId, user2Id: $currentUserId }
  )
}

mutation RemoveReverseFriend($friendId: String!) @auth(level: USER) {
  friendship_delete(
    key: { user2Id: "auth.uid", user1Id: $friendId }
  )
}

# Accept a pending friend request
mutation AcceptFriendRequest($user1Id: String!, $user2Id: String!) @auth(level: USER) {
  friendship_update(
    key: { user1Id: $user1Id, user2Id: $user2Id }
    data: { status: "accepted" }
  )
}

# ✅ Decline or reject a pending friend request
mutation DeclineFriendRequest($user1Id: String!, $user2Id: String!) @auth(level: USER) {
  friendship_delete(
    key: { user1Id: $user1Id, user2Id: $user2Id }
  )
}

#  Optional: Make friendship mutual (insert reverse)
mutation AddReverseFriend($friendId: String!) @auth(level: USER) {
  friendship_insert(
    data: {
      user1: { id: "auth.uid" }
      user2: { id: $friendId }
      status: "accepted"
    }
  )
}

# Create a habit
mutation CreateHabit($uid: String!, $title: String!, $description: String!, $category: String!, $streakGoal: Int!, $emoji: String!) @auth(level: USER) {
  habit_insert(
    data: { creatorId: $uid, title: $title, description: $description, category: $category, streakGoal: $streakGoal, emoji: $emoji }
  )
}

# Update a habit
mutation UpdateHabit($habitId: UUID!, $title: String, $description: String, $category: String, $streakGoal: Int, $emoji: String!) @auth(level: USER) {
  habit_update(
    key: { id: $habitId }
    data: { title: $title, description: $description, category: $category, streakGoal: $streakGoal, emoji: $emoji }
  )
}

# Delete a habit
mutation DeleteHabit($habitId: UUID!) @auth(level: USER) {
  habit_delete(
    key: { id: $habitId }
  )
}

# Update habit streak
mutation UpdateHabitStreak($habitId: UUID!, $currentStreak: Int!, $longestStreak: Int!, $lastTrackedDate: Timestamp!, $userId: String, $points: Int) @auth(level: USER) {
  userHabit_upsert(
    data: {
      habitId: $habitId,
      userId_expr: "auth.uid",
      currentStreak: $currentStreak,
      longestStreak: $longestStreak,
      lastTrackedDate: $lastTrackedDate
    }
  )
}

mutation updatePoints( $userId: String!, $points: Int!, $totalStreak: Int!, $newDate: Timestamp!) @auth(level: USER) {
    user_update(
      key: { id: $userId }
      data: { totalPoints: $points, totalStreak: $totalStreak, lastUpdatedStreakDate: $newDate }
    )
}

mutation DeleteUserHabit($habitId: UUID!, $userId: String!) @auth(level: USER) {
  userHabit_delete(
    key: {
      habitId: $habitId
      userId: $userId
    }
  )
}
mutation UnlockAchievement($userId: String!, $achievementId: UUID!) @auth(level: USER) {
  userAchievement_insert(
    data: {
      user: { id: $userId }
      achievement: { id: $achievementId }
    }
  )
}
mutation CreateAchievement(
  $title: String!,
  $description: String,
  $criteria: String,
  $icon: String
) @auth(level: USER) {
  achievement_insert(
    data: {
      title: $title,
      description: $description,
      criteria: $criteria,
      icon: $icon
    }
  )
}

# Create a notification
mutation CreateNotification($userId: String!, $type: String!, $message: String!, $fromUserId: String!, $habitId: UUID!) @auth(level: USER) {
  notification_insert(
    data: {
      user: { id: $userId }
      type: $type
      message: $message
      fromUser: { id: $fromUserId }
      habit: { id: $habitId }
    }
  )
}

