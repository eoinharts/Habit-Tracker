# Add HabitLike table
type HabitLike @model {
  id: UUID! @unique @default(uuid())
  habit: Habit! @relation
  likedBy: User! @relation
  createdAt: DateTime! @default(now())
}

# Add Notification table
type Notification @model {
  id: UUID! @unique @default(uuid())
  user: User! @relation
  type: String! # e.g. "HABIT_LIKE"
  message: String!
  read: Boolean! @default(false)
  createdAt: DateTime! @default(now())
  # Additional fields for habit like notifications
  fromUser: User @relation
  habit: Habit @relation
} 