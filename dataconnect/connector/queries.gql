

# Firebase Data Connect GraphQL Queries for Habit Tracker

# Get User Details
query GetUserDetails($userId: String!) @auth(level: USER) {
  users(where: { id: { eq: $userId } }) {
    id
    name
    email
    imageUrl
    totalStreak
    totalPoints
    lastUpdatedStreakDate
  }
}

query GetAllUsers @auth(level: USER) {
  users {
    id
    name
    email
    imageUrl
    totalStreak
  }
}

# ListFriends to show *both sides* of accepted friendships
query ListFriends($uid: String!) @auth(level: USER) {
  friendships(
    where: {
      _and: [
        { status: { eq: "accepted" } },
        {
          _or: [
            { user1: { id: { eq: $uid } } },
            { user2: { id: { eq: $uid } } }
          ]
        }
      ]
    }
  ) {
    user1 {
      id
      name
    }
    user2 {
      id
      name
    }
    status
  }
}


query ListIncomingRequests @auth(level: USER) {
  friendships(
    where: {
      user2Id: { eq: "auth.uid" }
      status: { eq: "pending" }
    }
  ) {
    user1 {
      id
      name
      email
    }
    user2 {
      id
    }
    status
  }
}

# Get user habits
query GetUserHabit($uid: String!) @auth(level: USER) {
  habits(where: { creatorId: { eq: $uid } }) {
    id
    title
    description
    category
    streakGoal
    emoji
    userHabitData: userHabits_on_habit(where: { userId: { eq: $uid } }) {
      currentStreak
      longestStreak
      lastTrackedDate
    }
  }
}


query GetHabitsWithUserDetails($userId: String!) @auth(level: PUBLIC) {
  user(key: { id: $userId }) {
    id
    name

    # Join from User → UserHabits → Habit
    userHabits_on_user {
      currentStreak
      longestStreak
      lastTrackedDate

      habit {
        id
        title
        description
        category
        streakGoal
        emoji
      }
    }
  }
}

# Get a habit by ID
query GetHabitById($habitId: UUID!) @auth(level: USER) {
  habit(id: $habitId) {
    id
    title
    description
    category
    streakGoal
    userHabitData: userHabits_on_habit(where: { userId: { eq: "auth.uid" } }) {
      currentStreak
      longestStreak
      lastTrackedDate
    }
  }
}
query ListAchievements @auth(level: NO_ACCESS) {
  achievements {
    id
    title
    description
    criteria
    icon
  }
}

query ListMyAchievements @auth(level: USER) {
  userAchievements(where: { user: { id: { eq: "auth.uid" } } }) {
    achievement {
      id
      title
      description
      criteria
      icon
    }
    unlockedAt
  }
}

query ListUserAchievements @auth(level: USER) {
  userAchievements(where: { user: { id: { eq: "auth.uid" } } }) {
    achievement {
      id
      title
      description
      criteria
      icon
    }
    unlockedAt
  }
}




